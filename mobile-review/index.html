<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>海洋棋手机布局对照验收</title><style>body{margin:0;padding:8px;background:#132d40;color:#e5f9ff;font:14px sans-serif;display:flex;gap:20px;align-items:flex-start}iframe{display:block;border:0;flex:none}aside{width:250px;position:sticky;top:12px;flex:none;padding:16px;border:1px solid #79cce2;border-radius:10px;background:#083d59}label{display:block;margin:12px 0}select{font:inherit;display:block;width:100%;margin-top:6px;padding:8px}p{line-height:1.7;font-size:12px}</style><iframe id="viewport" title="游戏测试视口" width="393" height="760" src="./game/index.html"></iframe><aside><b>手机布局验收</b><label>视口<select id="qa-size"><option>393x760</option><option>320x568</option><option>360x640</option><option>390x844</option><option>844x390</option><option>1366x768</option></select></label><label>版本<select id="qa-version"><option value="game">整改后</option><option value="before">整改前</option></select></label><p>两版使用独立测试存档。切换版本重新加载首页；调整视口保留当前棋局。</p></aside><script>const frame=document.querySelector('#viewport');document.querySelector('#qa-size').onchange=e=>{const[w,h]=e.target.value.split('x');frame.width=w;frame.height=h};document.querySelector('#qa-version').onchange=e=>{frame.src='./'+e.target.value+'/index.html'};</script></html>
