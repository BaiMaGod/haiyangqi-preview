<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>海洋棋首页 · 本地浏览器检查</title><style>
*{box-sizing:border-box}body{margin:0;background:#10202d;color:white;font:14px system-ui}header{padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:#10202d}button{font:inherit;padding:7px 12px;border:0;border-radius:7px;cursor:pointer;background:#31556b;color:white}button.active{background:#7ad9e8;color:#07263b}main{padding:12px;overflow:auto}iframe{display:block;border:0;transform-origin:top left;background:#032c44}#viewport{margin:0 auto;position:relative}small{color:#b6d3df}</style></head><body>
<header><b>海洋棋首页检查</b><button data-size="390,844" class="active">手机 390×844</button><button data-size="320,568">小屏 320×568</button><button data-size="844,390">横屏 844×390</button><button data-size="1365,768">桌面 1365×768</button><button data-size="768,1024">平板 768×1024</button><button id="debug">Debug 大棋神</button><small id="status"></small></header>
<main><div id="viewport"><iframe id="game-frame" title="海洋棋" src="../index.html?debug=1&amp;rank=1&amp;qa=home-v4-2" width="390" height="844"></iframe></div></main>
<script>
const frame=document.querySelector('iframe'),wrap=document.querySelector('#viewport');let current=[390,844];function resize(){const scale=Math.min(1,(window.innerWidth-24)/current[0]);frame.style.width=current[0]+'px';frame.style.height=current[1]+'px';frame.style.transform='scale('+scale+')';wrap.style.width=current[0]*scale+'px';wrap.style.height=current[1]*scale+'px';document.querySelector('#status').textContent=current.join(' × ')+' · scale '+scale.toFixed(2);}
document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{current=button.dataset.size.split(',').map(Number);document.querySelectorAll('[data-size]').forEach(b=>b.classList.toggle('active',b===button));resize();}));
document.querySelector('#debug').addEventListener('click',()=>{frame.src='../index.html?debug=1&rank=20&qa=home-v4-2';});window.addEventListener('resize',resize);resize();
</script></body></html>
