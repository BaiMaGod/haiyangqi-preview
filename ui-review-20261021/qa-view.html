<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>海洋棋响应式验收</title>
<style>body{margin:0;background:#172b3b;font:15px sans-serif;color:white}iframe{border:0;display:block;background:#062b43}aside{position:fixed;left:1150px;top:15px;padding:20px;background:#07354e;border:1px solid #85cbdb;border-radius:12px;width:220px}label{display:block;margin-bottom:20px}select{display:block;font-size:15px;margin-top:8px;width:210px;padding:8px}p{font-size:13px;line-height:1.6}</style>
<iframe id="qa-frame" title="游戏测试视口" src="./index.html" width="390" height="844"></iframe>
<aside><label>视口<select id="qa-size"><option>390x844</option><option>360x640</option><option>430x932</option><option>844x390</option><option>1366x768</option></select></label><label>起始棋局<select id="qa-case"><option value="fresh">全新开局</option><option value="draft">奇遇触发</option><option value="skills">主动技能</option><option value="states">棋子状态</option><option value="exhausted">技能耗尽</option><option value="retreat">回撤选择</option><option value="legacy">接力选择</option><option value="normal-win">普通胜利</option><option value="normal-loss">普通失利</option><option value="rogue-win">肉鸽胜利</option><option value="draw">反击和棋</option></select></label><p>开发验收页面，独立存档。只设置起始棋局，后续通过实际按钮完成操作。</p></aside>
<script>const frame=document.querySelector('#qa-frame');document.querySelector('#qa-size').onchange=e=>{const [w,h]=e.target.value.split('x');frame.width=w;frame.height=h;};document.querySelector('#qa-case').onchange=e=>{frame.src=e.target.value==='fresh'?'./index.html':'./qa.html?case='+encodeURIComponent(e.target.value);};</script></html>
